name: Foto's ophalen

# Tijdelijk: haalt kandidaat-foto's van Unsplash op (vrije Unsplash-licentie) en commit ze op deze branch,
# omdat de Claude-omgeving de fotosites niet zelf kan bereiken. Wordt verwijderd na het kiezen.
on:
  push:
    branches: [claude/fotos-kandidaten]
    paths: [fotos-kandidaten.txt]

permissions:
  contents: write

jobs:
  ophalen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p kandidaten
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          : > kandidaten/log.txt
          while read -r id; do
            [ -z "$id" ] && continue
            pagina=$(curl -sSL -A "$UA" "https://unsplash.com/photos/$id" || true)
            img=$(printf '%s' "$pagina" | grep -o 'https://images.unsplash.com/photo-[^"?&]*' | head -1)
            auteur=$(printf '%s' "$pagina" | grep -o '<title>[^<]*' | head -1 | sed 's/<title>//')
            if [ -n "$img" ] && curl -sSL --fail -A "$UA" -o "kandidaten/$id.jpg" "$img?w=1600&fm=jpg&q=72&fit=max"; then
              echo "OK $id | $img | $auteur" >> kandidaten/log.txt
            else
              echo "MISLUKT $id | img=$img | $auteur" >> kandidaten/log.txt
            fi
          done < fotos-kandidaten.txt
          cat kandidaten/log.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kandidaten
          git commit -m "Kandidaat-foto's opgehaald" || echo "niets te committen"
          git push
