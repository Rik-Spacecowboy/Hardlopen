name: Foto's ophalen

# Tijdelijk: haalt kandidaat-foto's van Pexels op (vrije Pexels-licentie) en commit ze op deze branch,
# omdat de Claude-omgeving de fotosites niet zelf kan bereiken. Wordt verwijderd na het kiezen.
on:
  push:
    branches: [claude/fotos-kandidaten]
    paths: [fotos-kandidaten.txt]

permissions:
  contents: write

jobs:
  ophalen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p kandidaten
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          : > kandidaten/log.txt
          while read -r id; do
            case "$id" in ''|\#*) continue;; esac
            url="https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=1600"
            code=$(curl -sSL -A "$UA" -o "kandidaten/$id.jpg" -w '%{http_code}' "$url" || true)
            soort=$(file -b "kandidaten/$id.jpg" | cut -c1-30)
            if [ "$code" = "200" ] && echo "$soort" | grep -q JPEG; then
              echo "OK $id | $code | $soort" >> kandidaten/log.txt
            else
              echo "MISLUKT $id | $code | $soort" >> kandidaten/log.txt; rm -f "kandidaten/$id.jpg"
            fi
          done < fotos-kandidaten.txt
          cat kandidaten/log.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kandidaten
          git commit -m "Kandidaat-foto's opgehaald" || echo "niets te committen"
          git push
