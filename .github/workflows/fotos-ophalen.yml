name: Foto's ophalen

# Tijdelijk: haalt kandidaat-foto's van Unsplash op (vrije Unsplash-licentie) en commit ze op deze branch,
# omdat de Claude-omgeving de fotosites niet zelf kan bereiken. Wordt verwijderd na het kiezen.
on:
  push:
    branches: [claude/fotos-kandidaten]
    paths: [fotos-kandidaten.txt]

permissions:
  contents: write

jobs:
  ophalen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p kandidaten
          while read -r id; do
            [ -z "$id" ] && continue
            curl -sSL --fail -o "kandidaten/$id.jpg" "https://unsplash.com/photos/$id/download?w=1600&fm=jpg&q=72" || echo "mislukt: $id"
          done < fotos-kandidaten.txt
          ls -la kandidaten
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kandidaten
          git commit -m "Kandidaat-foto's opgehaald" || echo "niets te committen"
          git push
